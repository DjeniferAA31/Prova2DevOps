services:
  db:
    image: postgres:16
    container_name: customers-db

    environment:
      POSTGRES_DB: customers_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app-network

  front:
    build:
      context: ../front
      dockerfile: Dockerfile

    container_name: customers-front

    ports:
      - "8080:80"

    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
